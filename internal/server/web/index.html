<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="afk-csrf-token" content="__AFK_CSRF_TOKEN__">
<title>afk · MISSION CONTROL</title>
<style>
/* ─── CUSTOM PROPERTIES ─────────────────────────────────────────── */
:root {
  --bg:         #10141c;
  --panel:      #1b2433;
  --panel-hi:   #222d40;
  --chrome:     #c7ccd6;
  --chrome-dim: #5c6375;
  --text:       #e8e3d3;
  --text-dim:   #8a93a5;
  --orange:     #ff6b35;
  --green:      #5af78e;
  --amber:      #f6c453;
  --blue:       #5a9bd4;
  --red:        #ff5470;
  --bevel-hi:   rgba(255,255,255,0.12);
  --bevel-lo:   rgba(0,0,0,0.5);
  --font:       'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace;
  --radius:     4px;
  --gap:        16px;
}

/* ─── RESET ─────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* ─── CRT OVERLAY ────────────────────────────────────────────────── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.04) 2px,
    rgba(0,0,0,0.04) 4px
  );
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9998;
  background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.5) 100%);
}

/* ─── HEADER ─────────────────────────────────────────────────────── */
#header {
  display: flex;
  align-items: center;
  gap: var(--gap);
  padding: 12px 24px;
  background: var(--panel);
  border-bottom: 2px solid var(--chrome-dim);
  box-shadow:
    inset 0 1px 0 var(--bevel-hi),
    0 2px 8px rgba(0,0,0,0.6);
  position: sticky;
  top: 0;
  z-index: 100;
}

.wordmark {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--orange);
  text-shadow: 0 0 12px rgba(255,107,53,0.6), 0 0 24px rgba(255,107,53,0.3);
  user-select: none;
}
.wordmark span {
  color: var(--chrome);
  font-size: 0.7em;
  letter-spacing: 0.08em;
}

nav {
  display: flex;
  gap: 4px;
}
.nav-btn {
  background: var(--panel-hi);
  border: 1px solid var(--chrome-dim);
  border-top-color: var(--bevel-hi);
  border-left-color: var(--bevel-hi);
  border-radius: var(--radius);
  color: var(--text-dim);
  font-family: var(--font);
  font-size: 0.75rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 6px 14px;
  cursor: pointer;
  transition: color 0.1s, background 0.1s;
  text-decoration: none;
  display: inline-block;
}
.nav-btn:hover { color: var(--text); background: #2a3549; }
.nav-btn.active {
  color: var(--orange);
  border-color: var(--orange);
  box-shadow: 0 0 6px rgba(255,107,53,0.3), inset 0 0 4px rgba(255,107,53,0.08);
}

.header-spacer { flex: 1; }

/* ─── RADAR BLIP ─────────────────────────────────────────────────── */
#telemetry {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  color: var(--green);
  text-shadow: 0 0 6px var(--green);
  user-select: none;
}
#radar-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
  animation: radar-idle 3s ease-in-out infinite;
}
#radar-dot.blip {
  animation: radar-blip 0.4s ease-out forwards;
}
@keyframes radar-idle {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.4; }
}
@keyframes radar-blip {
  0%   { transform: scale(1);   opacity: 1; box-shadow: 0 0 6px var(--green); }
  40%  { transform: scale(2.2); opacity: 1; box-shadow: 0 0 18px var(--green), 0 0 32px rgba(90,247,142,0.5); }
  100% { transform: scale(1);   opacity: 0.6; box-shadow: 0 0 6px var(--green); }
}

#clock {
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  min-width: 80px;
  text-align: right;
}

/* ─── MAIN LAYOUT ────────────────────────────────────────────────── */
#app {
  padding: 24px;
  max-width: 1400px;
  margin: 0 auto;
  overflow-x: hidden;
}

/* ─── SECTION HEADING ────────────────────────────────────────────── */
.section-heading {
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-heading::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, var(--chrome-dim), transparent);
}

/* ─── PANEL CARD ─────────────────────────────────────────────────── */
.panel {
  background: var(--panel);
  border: 1px solid var(--chrome-dim);
  border-top-color: var(--bevel-hi);
  border-left-color: var(--bevel-hi);
  border-radius: var(--radius);
  box-shadow:
    inset 0 1px 0 var(--bevel-hi),
    0 4px 16px rgba(0,0,0,0.4);
  padding: 16px;
}

/* ─── STATUS LAMPS ───────────────────────────────────────────────── */
.lamp {
  width: 10px; height: 10px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}
.lamp-todo { background: var(--amber); box-shadow: 0 0 4px var(--amber); }
.lamp-doing {
  background: var(--green);
  box-shadow: 0 0 6px var(--green), 0 0 12px rgba(90,247,142,0.4);
  animation: lamp-pulse 1.4s ease-in-out infinite;
}
.lamp-done { background: var(--blue); box-shadow: 0 0 4px var(--blue); }
.lamp-failed {
  background: var(--red);
  box-shadow: 0 0 6px var(--red);
  animation: lamp-blink 1.8s ease-in-out infinite;
}
@keyframes lamp-pulse {
  0%,100% { box-shadow: 0 0 6px var(--green), 0 0 12px rgba(90,247,142,0.4); }
  50%      { box-shadow: 0 0 12px var(--green), 0 0 28px rgba(90,247,142,0.7); }
}
@keyframes lamp-blink {
  0%,45%,55%,100% { opacity: 1; }
  50%              { opacity: 0.2; }
}

/* ─── GAUGE CARDS (MISSION CONTROL) ─────────────────────────────── */
.gauges {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--gap);
  margin-bottom: 24px;
}
.gauge {
  background: var(--panel);
  border: 1px solid var(--chrome-dim);
  border-top-color: var(--bevel-hi);
  border-left-color: var(--bevel-hi);
  border-radius: var(--radius);
  padding: 20px 16px 16px;
  box-shadow:
    inset 0 1px 0 var(--bevel-hi),
    inset 0 0 40px rgba(0,0,0,0.2),
    0 4px 16px rgba(0,0,0,0.5);
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
  position: relative;
  overflow: hidden;
}
.gauge:hover { border-color: var(--chrome); }
.gauge-label {
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.gauge-count {
  font-size: 3rem;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.gauge-todo .gauge-count { color: var(--amber); text-shadow: 0 0 20px rgba(246,196,83,0.5); }
.gauge-doing .gauge-count { color: var(--green); text-shadow: 0 0 20px rgba(90,247,142,0.5); }
.gauge-done    .gauge-count { color: var(--blue);  text-shadow: 0 0 20px rgba(90,155,212,0.5); }
.gauge-failed  .gauge-count { color: var(--red);   text-shadow: 0 0 20px rgba(255,84,112,0.5); }

/* starburst corner decoration */
.gauge::after {
  content: '';
  position: absolute;
  bottom: -20px; right: -20px;
  width: 60px; height: 60px;
  border-radius: 50%;
  opacity: 0.04;
}
.gauge-todo::after { background: var(--amber); }
.gauge-doing::after { background: var(--green); }
.gauge-done::after    { background: var(--blue); }
.gauge-failed::after  { background: var(--red); }

/* ─── TWIN PANELS ROW ────────────────────────────────────────────── */
.twin-panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap);
  margin-bottom: 24px;
}

/* ─── TASK ROW ───────────────────────────────────────────────────── */
.task-row {
  display: flex;
  align-items: flex-start; /* keep lamp/id/age aligned to top when body wraps */
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.1s;
  border: 1px solid transparent;
}
.task-row:hover {
  background: var(--panel-hi);
  border-color: var(--chrome-dim);
}
.task-id {
  font-size: 0.65rem;
  color: var(--text-dim);
  white-space: nowrap;
  min-width: 60px;
  padding-top: 2px; /* nudge to align with first line of wrapped body */
}
.task-body {
  flex: 1;
  min-width: 0;
  font-size: 0.8rem;
  white-space: pre-wrap;   /* preserve newlines in task bodies */
  word-break: break-word;  /* let long paths/URLs wrap inside the panel */
  color: var(--text);
}
.task-age {
  font-size: 0.65rem;
  color: var(--text-dim);
  white-space: nowrap;
  padding-top: 2px; /* match .task-id so right column aligns with first body line */
}

/* ─── FILTER CHIPS ───────────────────────────────────────────────── */
.filter-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: center;
}
.chip {
  padding: 4px 12px;
  border-radius: 20px;
  border: 1px solid var(--chrome-dim);
  background: transparent;
  color: var(--text-dim);
  font-family: var(--font);
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
}
.chip:hover { color: var(--text); border-color: var(--chrome); }
.chip.active-chip {
  color: var(--orange);
  border-color: var(--orange);
  box-shadow: 0 0 6px rgba(255,107,53,0.25);
}

/* ─── PAGINATION ─────────────────────────────────────────────────── */
.pager {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: flex-end;
  margin-top: 12px;
  font-size: 0.7rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
}
.pager-info { text-transform: uppercase; }
.pager .chip[disabled] {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}

/* ─── TABLE ──────────────────────────────────────────────────────── */
.roster-table {
  width: 100%;
  border-collapse: collapse;
}
.roster-table th {
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-dim);
  text-align: left;
  padding: 6px 10px;
  border-bottom: 1px solid var(--chrome-dim);
}
.roster-table td {
  padding: 8px 10px;
  border-bottom: 1px solid rgba(92,99,117,0.2);
  font-size: 0.8rem;
  vertical-align: middle;
}
.roster-table tr:hover td { background: var(--panel-hi); cursor: pointer; }
.roster-table tr:last-child td { border-bottom: none; }

.tag {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 10px;
  border: 1px solid var(--chrome-dim);
  font-size: 0.65rem;
  color: var(--text-dim);
  margin: 1px 2px;
}

/* ─── PUSH BUTTONS ───────────────────────────────────────────────── */
.push-btn {
  font-family: var(--font);
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 7px 16px;
  border-radius: 3px;
  cursor: pointer;
  transition: transform 0.06s, box-shadow 0.06s;
  border-top: 2px solid var(--bevel-hi);
  border-left: 2px solid var(--bevel-hi);
  border-right: 2px solid rgba(0,0,0,0.4);
  border-bottom: 2px solid rgba(0,0,0,0.4);
  position: relative;
  user-select: none;
}
.push-btn:active {
  transform: translate(1px, 1px);
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.4) !important;
  border-top-color: rgba(0,0,0,0.4);
  border-left-color: rgba(0,0,0,0.4);
}

.btn-orange { background: #c44e20; color: #ffe0d0; box-shadow: 0 3px 0 #7a2a00, 0 4px 8px rgba(0,0,0,0.4); }
.btn-orange:hover { background: #d45525; }
.btn-green  { background: #1e6640; color: #c0ffd8; box-shadow: 0 3px 0 #0a3320, 0 4px 8px rgba(0,0,0,0.4); }
.btn-green:hover  { background: #237349; }
.btn-red    { background: #8a1530; color: #ffd0d8; box-shadow: 0 3px 0 #4a0a18, 0 4px 8px rgba(0,0,0,0.4); }
.btn-red:hover    { background: #9a1a38; }
.btn-blue   { background: #1a4a6e; color: #c8e4f8; box-shadow: 0 3px 0 #0a2040, 0 4px 8px rgba(0,0,0,0.4); }
.btn-blue:hover   { background: #1f5580; }
.btn-dim    { background: #2a3549; color: var(--text-dim); box-shadow: 0 3px 0 #151e2e, 0 4px 8px rgba(0,0,0,0.4); }
.btn-dim:hover    { background: #303e55; }

.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }

/* ─── FORM FIELDS ────────────────────────────────────────────────── */
.field-label { display:block; font-size:0.65rem; letter-spacing:0.15em;
  text-transform:uppercase; color:var(--text-dim); margin-bottom:6px; }
.field-input, .field-textarea { width:100%; font-family:var(--font);
  font-size:0.85rem; color:var(--text); background:rgba(0,0,0,0.25);
  border:1px solid var(--chrome-dim); border-radius:var(--radius);
  padding:9px 11px; margin-bottom:16px; box-sizing:border-box; }
.field-input:focus, .field-textarea:focus { outline:none;
  border-color:var(--orange);
  box-shadow:0 0 6px rgba(255,107,53,0.3), inset 0 0 4px rgba(255,107,53,0.06); }
.field-input::placeholder, .field-textarea::placeholder { color:var(--chrome-dim); }
.field-textarea { resize:vertical; line-height:1.5; min-height:120px; }

/* ─── DOSSIER LAYOUT ─────────────────────────────────────────────── */
.dossier-body {
  background: rgba(0,0,0,0.25);
  border: 1px solid var(--chrome-dim);
  border-radius: var(--radius);
  padding: 14px;
  font-size: 0.85rem;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  margin-bottom: 16px;
}
.meta-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 8px;
  margin-bottom: 16px;
}
.meta-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.meta-label {
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.meta-value { font-size: 0.8rem; }

/* ─── TIMELINE ───────────────────────────────────────────────────── */
.timeline { display: flex; flex-direction: column; gap: 0; }
.tl-item {
  display: flex;
  gap: 12px;
  position: relative;
  padding-bottom: 10px;
}
.tl-item::before {
  content: '';
  position: absolute;
  left: 5px; top: 18px;
  width: 1px;
  bottom: 0;
  background: var(--chrome-dim);
  opacity: 0.4;
}
.tl-item:last-child::before { display: none; }
.tl-dot {
  width: 11px; height: 11px;
  border-radius: 50%;
  background: var(--chrome-dim);
  border: 2px solid var(--panel);
  flex-shrink: 0;
  margin-top: 3px;
}
.tl-content { flex: 1; min-width: 0; }
.tl-type {
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--orange);
}
.tl-at { font-size: 0.65rem; color: var(--text-dim); }
.tl-msg { font-size: 0.78rem; color: var(--text); margin-top: 2px; word-break: break-word; }

/* ─── TOAST ──────────────────────────────────────────────────────── */
#toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: #3a0e1a;
  border: 1px solid var(--red);
  border-radius: var(--radius);
  padding: 12px 18px;
  font-size: 0.78rem;
  color: var(--red);
  text-shadow: 0 0 6px rgba(255,84,112,0.4);
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  z-index: 200;
  max-width: 380px;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
.toast-label {
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 4px;
}

/* ─── READINESS BLOCK ────────────────────────────────────────────── */
.readiness-ok {
  display: flex; align-items: center; gap: 8px;
  font-size: 0.78rem; color: var(--green);
}
.readiness-block {
  display: flex; flex-direction: column; gap: 6px;
}
.reason-item {
  background: rgba(255,84,112,0.06);
  border: 1px solid rgba(255,84,112,0.3);
  border-radius: var(--radius);
  padding: 6px 10px;
  font-size: 0.75rem;
}
.reason-kind {
  font-size: 0.65rem; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--red); margin-bottom: 2px;
}

/* ─── LOADING / EMPTY ────────────────────────────────────────────── */
.state-msg {
  text-align: center;
  padding: 32px;
  color: var(--text-dim);
  font-size: 0.8rem;
  letter-spacing: 0.08em;
}
.state-msg .big { font-size: 1.6rem; color: var(--chrome-dim); margin-bottom: 8px; }

/* ─── BACK LINK ──────────────────────────────────────────────────── */
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-dim); cursor: pointer; margin-bottom: 16px;
  border: none; background: none; font-family: var(--font);
  padding: 0;
}
.back-link:hover { color: var(--orange); }

/* ─── CONFIRM DIALOG ─────────────────────────────────────────────── */
#confirm-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 300;
  display: none;
  align-items: center; justify-content: center;
}
#confirm-overlay.show { display: flex; }
.confirm-box {
  background: var(--panel);
  border: 1px solid var(--red);
  border-radius: var(--radius);
  padding: 28px 32px;
  max-width: 400px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.8);
}
.confirm-title {
  font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--red); margin-bottom: 12px;
}
.confirm-msg { font-size: 0.85rem; color: var(--text); margin-bottom: 20px; line-height: 1.5; }
.confirm-btns { display: flex; gap: 10px; justify-content: flex-end; }

/* ─── BACK BUTTON (dossier) ──────────────────────────────────────── */
.dossier-header { margin-bottom: 20px; }
.dossier-title {
  font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--orange); margin-bottom: 6px;
}
.dossier-id {
  font-size: 1.1rem; font-weight: 700; color: var(--text);
  letter-spacing: 0.05em;
}

/* ─── ATTEMPTS TABLE ─────────────────────────────────────────────── */
.attempts-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
.attempts-table th {
  font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--text-dim); text-align: left; padding: 5px 8px;
  border-bottom: 1px solid var(--chrome-dim);
}
.attempts-table td {
  padding: 6px 8px;
  border-bottom: 1px solid rgba(92,99,117,0.2);
  word-break: break-word;
}
.attempts-table tr:last-child td { border-bottom: none; }

/* ─── INLINE STATUS BADGE ────────────────────────────────────────── */
.status-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
}
.status-todo { color: var(--amber); }
.status-doing { color: var(--green); }
.status-done    { color: var(--blue); }
.status-failed  { color: var(--red); }
.status-deleted { color: var(--muted); }

/* ─── PRUNE BTN ──────────────────────────────────────────────────── */
.prune-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}

/* ─── SCROLLABLE PANEL BODY ──────────────────────────────────────── */
.panel-scroll { max-height: 320px; overflow-y: auto; }
.panel-scroll::-webkit-scrollbar { width: 4px; }
.panel-scroll::-webkit-scrollbar-track { background: var(--bg); }
.panel-scroll::-webkit-scrollbar-thumb { background: var(--chrome-dim); border-radius: 2px; }

/* ─── INLINE ERROR IN DOSSIER ────────────────────────────────────── */
.error-block {

</style>
</head>
<body>

<!-- ─── HEADER ─────────────────────────────────────────────────────── -->
<header id="header">
  <div class="wordmark">afk <span>· MISSION CONTROL</span></div>
  <nav>
    <a class="nav-btn" id="nav-home"  href="#/">MISSION CONTROL</a>
    <a class="nav-btn" id="nav-tasks" href="#/tasks">ROSTER</a>
    <a class="nav-btn" id="nav-new" href="#/tasks/new">NEW TASK</a>
  </nav>
  <div class="header-spacer"></div>
  <div id="telemetry">
    <div id="radar-dot"></div>
    TELEMETRY · LIVE
  </div>
  <div id="clock">--:--:--</div>
</header>

<!-- ─── APP ROOT ───────────────────────────────────────────────────── -->
<div id="app"></div>

<!-- ─── TOAST ──────────────────────────────────────────────────────── -->
<div id="toast" role="alert">
  <div class="toast-label">⚠ ANOMALY DETECTED</div>
  <div id="toast-msg"></div>
</div>

<!-- ─── CONFIRM DIALOG ──────────────────────────────────────────────── -->
<div id="confirm-overlay">
  <div class="confirm-box" role="dialog" aria-modal="true" aria-labelledby="confirm-msg">
    <div class="confirm-title">CONFIRM OPERATION</div>
    <div class="confirm-msg" id="confirm-msg"></div>
    <div class="confirm-btns">
      <button class="push-btn btn-dim" id="confirm-cancel">ABORT</button>
      <button class="push-btn btn-red" id="confirm-ok">CONFIRM</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════════
   UTILITIES
═══════════════════════════════════════════════════════════════════ */

function $(sel, ctx) { return (ctx || document).querySelector(sel); }

function el(tag, props, ...children) {
  const e = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') e.className = v;
      else if (k === 'style') Object.assign(e.style, v);
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
  }
  for (const c of children) {
    if (c == null) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

// txt — text node from any value. XSS-safe by construction; use for ALL data-derived strings.
function txt(s) { return document.createTextNode(String(s ?? '')); }

// asButton — augments el() props so a non-<button> element is operable by keyboard + AT.
function asButton(props, handler) {
  return Object.assign({}, props, {
    role: 'button',
    tabindex: 0,
    onclick: handler,
    onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handler(e); } },
  });
}

function lamp(status) {
  const d = el('span', { class: `lamp lamp-${status}` });
  return d;
}

function statusBadge(status) {
  return el('span', { class: `status-badge status-${status}` }, lamp(status), txt(' ' + labelFor(status)));
}

const LABELS = {
  todo: 'ON THE PAD',
  doing: 'IN ORBIT',
  done:    'TOUCHDOWN',
  failed:  'ANOMALY',
  deleted: 'DELETED',
};
function labelFor(status) { return LABELS[status] || status.toUpperCase(); }

function age(ts) {
  if (!ts) return '—';
  const diff = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
  if (diff < 0) return 'T+0s';
  if (diff < 60) return `T+${diff}s`;
  if (diff < 3600) return `T+${Math.floor(diff/60)}m`;
  if (diff < 86400) return `T+${Math.floor(diff/3600)}h`;
  return `T+${Math.floor(diff/86400)}d`;
}

function fmtTs(ts) {
  if (!ts) return '—';
  try { return new Date(ts).toLocaleString(); } catch { return ts; }
}

function truncate(s, n) {
  if (!s) return '';
  return s.length > n ? s.slice(0, n) + '…' : s;
}

/* ═══════════════════════════════════════════════════════════════════
   API
═══════════════════════════════════════════════════════════════════ */

const csrfToken = document.querySelector('meta[name="afk-csrf-token"]')?.content || '';

async function api(path, opts) {
  opts = opts || {};
  const method = (opts.method || 'GET').toUpperCase();
  if (method === 'POST' || method === 'PATCH') {
    opts.headers = Object.assign({ 'X-AFK-CSRF-Token': csrfToken }, opts.headers || {});
  }
  const res = await fetch(path, opts);
  const ct = res.headers.get('content-type') || '';
  const body = ct.includes('json') ? await res.json() : await res.text();
  if (!res.ok) {
    const msg = (body && body.error) ? body.error : (typeof body === 'string' ? body : res.statusText);
    throw new Error(msg);
  }
  return body;
}

const API = {
  status:  ()         => api('/api/status'),
  tasks:   (status)   => api('/api/tasks' + (status ? `?status=${encodeURIComponent(status)}` : '')),
  task:    (id)       => api(`/api/tasks/${encodeURIComponent(id)}`),
  ready:   ()         => api('/api/take?dry_run=true', { method: 'POST' }),
  set:     (id, status, body) => api(`/api/tasks/${encodeURIComponent(id)}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ status }, body || {})),
  }),
  create: (payload) => api('/api/tasks', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  }),
  paths: () => api('/api/paths'),
};

/* ═══════════════════════════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════════════════════════ */

let _toastTimer = null;
function showToast(msg) {
  const toast = $('#toast');
  const msgEl = $('#toast-msg');
  msgEl.textContent = msg;
  toast.classList.add('show');
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => toast.classList.remove('show'), 5000);
}

/* ═══════════════════════════════════════════════════════════════════
   CONFIRM DIALOG
═══════════════════════════════════════════════════════════════════ */

function confirm(msg) {
  return new Promise((resolve) => {
    const ov = $('#confirm-overlay');
    const prior = document.activeElement;
    $('#confirm-msg').textContent = msg;
    ov.classList.add('show');
    const ok = $('#confirm-ok');
    const cancel = $('#confirm-cancel');
    ok.focus();
    function cleanup(val) {
      ov.classList.remove('show');
      ok.removeEventListener('click', onOk);
      cancel.removeEventListener('click', onCancel);
      document.removeEventListener('keydown', onKeydown);
      if (prior && prior.focus) prior.focus();
      resolve(val);
    }
    function onOk()     { cleanup(true);  }
    function onCancel() { cleanup(false); }
    function onKeydown(e) { if (e.key === 'Escape') { e.preventDefault(); cleanup(false); } }
    ok.addEventListener('click', onOk);
    cancel.addEventListener('click', onCancel);
    document.addEventListener('keydown', onKeydown);
  });
}

/* ═══════════════════════════════════════════════════════════════════
   RADAR BLIP + CLOCK
═══════════════════════════════════════════════════════════════════ */

function radarBlip() {
  const dot = $('#radar-dot');
  dot.classList.remove('blip');
  void dot.offsetWidth; // reflow
  dot.classList.add('blip');
  setTimeout(() => dot.classList.remove('blip'), 500);
}

function startClock() {
  function tick() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    const clockEl = $('#clock');
    if (clockEl) clockEl.textContent = `${hh}:${mm}:${ss}`;
  }
  tick();
  setInterval(tick, 1000);
}

/* ═══════════════════════════════════════════════════════════════════
   ROUTER
═══════════════════════════════════════════════════════════════════ */

const POLL_INTERVAL_MS = 10000;

const VIEWS = {};
let _currentRoute = null;
let _pollTimer = null;

function registerView(route, fn) { VIEWS[route] = fn; }

function navigate(hash) {
  window.location.hash = hash;
}

function parseRoute(hash) {
  const h = (hash || '#/').replace(/^#/, '') || '/';
  if (h === '/')             return { name: 'home' };
  if (h === '/tasks/new')    return { name: 'tasksNew' };
  const tasksMatch = h.match(/^\/tasks(?:\?(.*))?$/);
  if (tasksMatch) {
    const params = new URLSearchParams(tasksMatch[1] || '');
    const pageRaw = parseInt(params.get('page'), 10);
    return {
      name: 'tasks',
      filter: params.get('status') || '',
      page: Number.isFinite(pageRaw) && pageRaw >= 1 ? pageRaw : 1,
    };
  }
  const m2 = h.match(/^\/task\/(.+)$/);
  if (m2)             return { name: 'dossier', id: decodeURIComponent(m2[1]) };
  return { name: 'home' };
}

// Build the hash for the roster route. Omits page when 1 so old URLs stay clean.
function tasksHash(filter, page) {
  const params = new URLSearchParams();
  if (filter) params.set('status', filter);
  if (page && page > 1) params.set('page', String(page));
  const qs = params.toString();
  return qs ? `#/tasks?${qs}` : '#/tasks';
}

function updateNav(route) {
  $('#nav-home').classList.toggle('active',  route.name === 'home');
  $('#nav-tasks').classList.toggle('active', route.name === 'tasks' || route.name === 'dossier');
  $('#nav-new').classList.toggle('active', route.name === 'tasksNew');
}

// mountView — render a route's view off-DOM, then atomically swap into #app.
// preserveScroll=true is the poll/refresh path: keep scrollY, skip swap if
// nothing changed, and on fetch error keep the current page rather than
// blanking it. preserveScroll=false is a fresh navigation: scroll to top.
async function mountView(route, preserveScroll) {
  const app = $('#app');
  if (!app) return;
  if (preserveScroll && route.name === 'tasksNew') return;
  const staging = document.createElement('div');
  try {
    if (VIEWS[route.name]) await VIEWS[route.name](staging, route);
  } catch (err) {
    if (preserveScroll) return;            // poll failure: keep current page
    staging.replaceChildren(el('div', { class: 'error-block' }, txt('⚠ ' + err.message)));
  }
  if (route !== _currentRoute) return;            // navigated away mid-fetch
  if (staging.innerHTML === app.innerHTML) return; // nothing changed
  const y = preserveScroll ? window.scrollY : 0;
  app.replaceChildren(...staging.childNodes);
  // Force a synchronous layout so scrollTo clamps against the NEW document
  // height, not the stale pre-swap one — otherwise the restore is clamped
  // to ~0 and the page jumps to the top on every poll.
  void document.documentElement.offsetHeight;
  window.scrollTo(0, y);
}

async function render() {
  const route = parseRoute(window.location.hash);
  updateNav(route);

  if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }

  _currentRoute = route;
  await mountView(route, false);

  _pollTimer = setInterval(() => {
    if (document.hidden) return;
    radarBlip();
    mountView(_currentRoute, true);
  }, POLL_INTERVAL_MS);
}

window.addEventListener('hashchange', render);

/* ═══════════════════════════════════════════════════════════════════
   SHARED COMPONENT: TASK LIST
═══════════════════════════════════════════════════════════════════ */

function renderTaskList(tasks, emptyMsg) {
  if (!tasks || tasks.length === 0) {
    return el('div', { class: 'state-msg' }, txt(emptyMsg || 'ALL QUIET ON THE LAUNCHPAD'));
  }
  const frag = document.createDocumentFragment();
  for (const t of tasks) {
    const row = el('div',
      asButton({ class: 'task-row', 'aria-label': `Open task ${t.id}` }, () => navigate(`#/task/${encodeURIComponent(t.id)}`)),
      lamp(t.status),
      el('span', { class: 'task-id' }, txt(t.id)),
      el('span', { class: 'task-body' }, txt(t.body)),
      el('span', { class: 'task-age' }, txt(age(t.created)))
    );
    frag.appendChild(row);
  }
  return frag;
}

/* ═══════════════════════════════════════════════════════════════════
   VIEW: MISSION CONTROL  (#/)
═══════════════════════════════════════════════════════════════════ */

registerView('home', async (container, _route) => {
  let snap, readyTasks;
  try {
    [snap, readyTasks] = await Promise.all([API.status(), API.ready()]);
  } catch (err) {
    container.appendChild(el('div', { class: 'state-msg' },
      el('div', { class: 'big' }, txt('⚠')),
      txt(err.message)
    ));
    return;
  }

  const counts = snap.counts || {};
  const todo = counts.todo || 0;
  const doing = counts.doing || 0;
  const done    = counts.done    || 0;
  const failed  = counts.failed  || 0;

  // Section heading
  const heading = el('div', { class: 'section-heading' }, txt('MISSION CONTROL'));
  container.appendChild(heading);

  // Gauge cards
  const gauges = el('div', { class: 'gauges' });
  const specs = [
    { status: 'todo', label: 'ON THE PAD',  count: todo, filter: 'todo' },
    { status: 'doing', label: 'IN ORBIT',    count: doing, filter: 'doing' },
    { status: 'done',    label: 'TOUCHDOWN',   count: done,    filter: 'done'    },
    { status: 'failed',  label: 'ANOMALY',     count: failed,  filter: 'failed'  },
  ];
  for (const s of specs) {
    const g = el('div',
      asButton({ class: `gauge gauge-${s.status}`, 'aria-label': `Show ${s.label} tasks` }, () => navigate(`#/tasks?status=${encodeURIComponent(s.filter)}`)),
      el('div', { class: 'gauge-label' }, lamp(s.status), txt(' ' + s.label)),
      el('div', { class: 'gauge-count' }, txt(s.count))
    );
    gauges.appendChild(g);
  }
  container.appendChild(gauges);

  // Twin panels: launch window + in orbit
  const twin = el('div', { class: 'twin-panels' });

  // LAUNCH WINDOW (ready tasks)
  const launchPanel = el('div', { class: 'panel' });
  launchPanel.appendChild(el('div', { class: 'section-heading' }, txt('LAUNCH WINDOW')));
  const launchScroll = el('div', { class: 'panel-scroll' });
  launchScroll.appendChild(renderTaskList(readyTasks, 'NO TASKS ON THE LAUNCH WINDOW'));
  launchPanel.appendChild(launchScroll);
  twin.appendChild(launchPanel);

  // IN ORBIT (doing tasks)
  const orbitPanel = el('div', { class: 'panel' });
  orbitPanel.appendChild(el('div', { class: 'section-heading' }, txt('IN ORBIT')));
  const orbitScroll = el('div', { class: 'panel-scroll' });
  orbitScroll.appendChild(renderTaskList(snap.doing, 'NO ACTIVE MISSIONS'));
  orbitPanel.appendChild(orbitScroll);
  twin.appendChild(orbitPanel);

  container.appendChild(twin);
});

/* ═══════════════════════════════════════════════════════════════════
   VIEW: ROSTER  (#/tasks)
═══════════════════════════════════════════════════════════════════ */

const TASKS_PAGE_SIZE = 100;

registerView('tasks', async (container, route) => {
  let tasks;
  try {
    tasks = await API.tasks(route.filter);
  } catch (err) {
    container.appendChild(el('div', { class: 'state-msg' }, txt(err.message)));
    return;
  }

  // Newest first. created is RFC3339, so lexical sort works.
  tasks = (tasks || []).slice().sort((a, b) =>
    (b.created || '').localeCompare(a.created || '')
  );

  container.appendChild(el('div', { class: 'section-heading' }, txt('TASK ROSTER')));

  // Filter chips
  const filterBar = el('div', { class: 'filter-bar' });
  const filters = [
    { label: 'ALL',        value: '' },
    { label: 'ON THE PAD', value: 'todo' },
    { label: 'IN ORBIT',   value: 'doing' },
    { label: 'TOUCHDOWN',  value: 'done' },
    { label: 'ANOMALY',    value: 'failed' },
    { label: 'DELETED',    value: 'deleted' },
  ];
  for (const f of filters) {
    const chip = el('button', {
      class: 'chip' + (route.filter === f.value ? ' active-chip' : ''),
      onclick: () => {
        _currentRoute = { name: 'tasks', filter: f.value, page: 1 };
        navigate(tasksHash(f.value, 1));
      },
    }, txt(f.label));
    filterBar.appendChild(chip);
  }
  container.appendChild(filterBar);

  if (tasks.length === 0) {
    container.appendChild(el('div', { class: 'state-msg' }, txt('ALL QUIET ON THE LAUNCHPAD')));
    return;
  }

  // Pagination: clamp the requested page into the available range.
  const totalPages = Math.max(1, Math.ceil(tasks.length / TASKS_PAGE_SIZE));
  const currentPage = Math.min(Math.max(1, route.page || 1), totalPages);
  const sliceStart = (currentPage - 1) * TASKS_PAGE_SIZE;
  const pageTasks = tasks.slice(sliceStart, sliceStart + TASKS_PAGE_SIZE);

  // Table
  const panel = el('div', { class: 'panel' });
  const table = el('table', { class: 'roster-table' });
  const thead = el('thead');
  const hr = el('tr');
  for (const h of ['', 'ID', 'BODY', 'STATUS', 'PRIORITY', 'TAGS', 'AGE']) {
    hr.appendChild(el('th', null, txt(h)));
  }
  thead.appendChild(hr);
  table.appendChild(thead);

  const tbody = el('tbody');
  for (const t of pageTasks) {
    const tr = el('tr', asButton({ 'aria-label': `Open task ${t.id}` }, () => navigate(`#/task/${encodeURIComponent(t.id)}`)));

    // lamp
    const tdLamp = el('td'); tdLamp.appendChild(lamp(t.status)); tr.appendChild(tdLamp);
    // id
    const tdId = el('td', { class: 'task-id' }); tdId.appendChild(txt(t.id)); tr.appendChild(tdId);
    // body
    const tdBody = el('td', { style: { maxWidth: '380px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } });
    tdBody.appendChild(txt(truncate(t.body, 80))); tr.appendChild(tdBody);
    // status
    const tdStatus = el('td'); tdStatus.appendChild(statusBadge(t.status)); tr.appendChild(tdStatus);
    // priority
    const tdPri = el('td'); tdPri.appendChild(txt(t.priority || '—')); tr.appendChild(tdPri);
    // tags
    const tdTags = el('td');
    if (t.tags && t.tags.length > 0) {
      for (const tag of t.tags) {
        const tagEl = el('span', { class: 'tag' }); tagEl.appendChild(txt(tag)); tdTags.appendChild(tagEl);
      }
    } else { tdTags.appendChild(txt('—')); }
    tr.appendChild(tdTags);
    // age
    const tdAge = el('td'); tdAge.appendChild(txt(age(t.created))); tr.appendChild(tdAge);

    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  panel.appendChild(table);
  container.appendChild(panel);

  // Pager (only when there is more than one page).
  if (totalPages > 1) {
    const rangeStart = sliceStart + 1;
    const rangeEnd = sliceStart + pageTasks.length;
    const pager = el('div', { class: 'pager' });
    pager.appendChild(el('span', { class: 'pager-info' },
      txt(`${rangeStart}–${rangeEnd} OF ${tasks.length} · PAGE ${currentPage} / ${totalPages}`)));

    const mkBtn = (label, targetPage, enabled) => {
      const attrs = { class: 'chip', onclick: () => {
        _currentRoute = { name: 'tasks', filter: route.filter, page: targetPage };
        navigate(tasksHash(route.filter, targetPage));
      }};
      if (!enabled) attrs.disabled = true;
      return el('button', attrs, txt(label));
    };
    pager.appendChild(mkBtn('PREV', currentPage - 1, currentPage > 1));
    pager.appendChild(mkBtn('NEXT', currentPage + 1, currentPage < totalPages));
    container.appendChild(pager);
  }
});

/* ═══════════════════════════════════════════════════════════════════
   VIEW: NEW TASK FORM  (#/tasks/new)
═══════════════════════════════════════════════════════════════════ */

registerView('tasksNew', async (container, _route) => {
  let recent = [];
  try { recent = (await API.paths()) || []; } catch { recent = []; }

  const panel = el('div', { class: 'panel' });

  panel.appendChild(el('div', { class: 'section-heading' }, txt('FLIGHT PLAN')));

  // Working directory field
  const cwdId = 'new-task-cwd';
  const listId = 'new-task-cwd-list';
  panel.appendChild(el('label', { class: 'field-label', for: cwdId }, txt('WORKING DIRECTORY')));
  const datalist = el('datalist', { id: listId });
  for (const p of recent) {
    datalist.appendChild(el('option', { value: p }));
  }
  panel.appendChild(datalist);
  const cwdInput = el('input', {
    class: 'field-input',
    type: 'text',
    id: cwdId,
    list: listId,
    placeholder: '/path/to/repo (optional)',
    autocomplete: 'off',
  });
  panel.appendChild(cwdInput);

  // Task body field
  const bodyId = 'new-task-body';
  panel.appendChild(el('label', { class: 'field-label', for: bodyId }, txt('TASK BODY')));
  const bodyTextarea = el('textarea', {
    class: 'field-textarea',
    id: bodyId,
    rows: '6',
    placeholder: 'Describe the task...',
  });
  panel.appendChild(bodyTextarea);

  // Submit handler
  async function submit() {
    const body = bodyTextarea.value.trim();
    if (!body) { showToast('TASK BODY REQUIRED'); return; }
    const cwd = cwdInput.value.trim();
    try {
      const res = await API.create({ body, cwd });
      navigate('#/task/' + encodeURIComponent(res.id));
    } catch (err) { showToast(err.message); }
  }

  // Button row
  const btnRow = el('div', { class: 'btn-row' });
  btnRow.appendChild(el('button', { class: 'push-btn btn-green', onclick: submit }, txt('ADD TASK')));
  btnRow.appendChild(el('button', { class: 'push-btn btn-dim', onclick: () => navigate('#/tasks') }, txt('CANCEL')));
  panel.appendChild(btnRow);

  container.appendChild(panel);
});

/* ═══════════════════════════════════════════════════════════════════
   VIEW: FLIGHT DOSSIER  (#/task/:id)
═══════════════════════════════════════════════════════════════════ */

registerView('dossier', async (container, route) => {
  let data;
  try {
    data = await API.task(route.id);
  } catch (err) {
    container.appendChild(el('div', { class: 'state-msg' }, txt(err.message)));
    return;
  }

  const t = data.task;
  const events = data.events || [];
  const attempts = data.attempts || [];

  // Back button
  const back = el('button', { class: 'back-link', onclick: () => navigate('#/tasks') },
    txt('← BACK TO ROSTER')
  );
  container.appendChild(back);

  // Dossier header
  const hdr = el('div', { class: 'dossier-header' });
  hdr.appendChild(el('div', { class: 'dossier-title' }, txt('FLIGHT DOSSIER')));
  const idEl = el('div', { class: 'dossier-id' }); idEl.appendChild(txt(t.id));
  hdr.appendChild(idEl);
  container.appendChild(hdr);

  // Body block
  const bodyLabel = el('div', { class: 'section-heading' }, txt('MISSION BRIEF'));
  container.appendChild(bodyLabel);
  const bodyBlock = el('div', { class: 'dossier-body' });
  bodyBlock.appendChild(txt(t.body));
  container.appendChild(bodyBlock);

  // Error block (if failed)
  if (t.error) {
    const errLabel = el('div', { class: 'section-heading' }, txt('FAILURE REPORT'));
    container.appendChild(errLabel);
    const errBlock = el('div', { class: 'error-block' });
    errBlock.appendChild(txt(t.error));
    container.appendChild(errBlock);
  }

  // Metadata grid
  const metaLabel = el('div', { class: 'section-heading' }, txt('TELEMETRY DATA'));
  container.appendChild(metaLabel);
  const grid = el('div', { class: 'meta-grid panel' });
  const metaFields = [
    { label: 'STATUS',        value: () => statusBadge(t.status) },
    { label: 'PRIORITY',      value: t.priority || '—' },
    { label: 'CREATED',       value: fmtTs(t.created) },
    { label: 'STARTED',       value: fmtTs(t.started) },
    { label: 'FINISHED',      value: fmtTs(t.finished) },
    { label: 'LEASE EXPIRES', value: fmtTs(t.lease_expires) },
    { label: 'AGENT',         value: t.agent || '—' },
    { label: 'SOURCE',        value: t.source || '—' },
    { label: 'CWD',           value: t.cwd || '—' },
    { label: 'GROUP',         value: t.group_id || '—' },
    { label: 'RESOURCE KEY',  value: t.resource_key || '—' },
  ];
  if (t.tags && t.tags.length > 0) {
    metaFields.push({ label: 'TAGS', value: t.tags.join(', ') });
  }

  for (const f of metaFields) {
    const item = el('div', { class: 'meta-item' });
    item.appendChild(el('div', { class: 'meta-label' }, txt(f.label)));
    const val = el('div', { class: 'meta-value' });
    if (typeof f.value === 'function') {
      val.appendChild(f.value());
    } else {
      val.appendChild(txt(f.value));
    }
    item.appendChild(val);
    grid.appendChild(item);
  }
  container.appendChild(grid);

  // Action buttons
  const actLabel = el('div', { class: 'section-heading', style: { marginTop: '16px' } }, txt('CONTROL PANEL'));
  container.appendChild(actLabel);
  const actPanel = el('div', { class: 'panel' });
  const btnRow = el('div', { class: 'btn-row' });

  async function doAction(status, body) {
    try {
      await API.set(t.id, status, body);
      _currentRoute = route;
      await mountView(_currentRoute, true);
    } catch (err) { showToast(err.message); }
  }

  // done / failed — todo or doing
  if (t.status === 'todo' || t.status === 'doing') {
    btnRow.appendChild(el('button', { class: 'push-btn btn-green', onclick: () => doAction('done', {}) }, txt('TOUCHDOWN')));
    btnRow.appendChild(el('button', { class: 'push-btn btn-red',   onclick: () => doAction('failed', { reason: 'manual failure' }) }, txt('DECLARE ANOMALY')));
  }
  if (t.status !== 'deleted') {
    btnRow.appendChild(el('button', { class: 'push-btn btn-red', onclick: () => doAction('deleted', { note: 'deleted from web UI' }) }, txt('DELETE')));
  }
  actPanel.appendChild(btnRow);
  container.appendChild(actPanel);

  // Mission log (events)
  if (events.length > 0) {
    const logLabel = el('div', { class: 'section-heading', style: { marginTop: '16px' } }, txt('MISSION LOG'));
    container.appendChild(logLabel);
    const logPanel = el('div', { class: 'panel' });
    const timeline = el('div', { class: 'timeline' });
    for (const ev of events) {
      const item = el('div', { class: 'tl-item' });
      item.appendChild(el('div', { class: 'tl-dot' }));
      const content = el('div', { class: 'tl-content' });
      const typeEl = el('div', { class: 'tl-type' }); typeEl.appendChild(txt(ev.type)); content.appendChild(typeEl);
      const atEl   = el('div', { class: 'tl-at' });   atEl.appendChild(txt(fmtTs(ev.at)));   content.appendChild(atEl);
      if (ev.message) {
        const msgEl = el('div', { class: 'tl-msg' }); msgEl.appendChild(txt(ev.message)); content.appendChild(msgEl);
      }
      item.appendChild(content);
      timeline.appendChild(item);
    }
    logPanel.appendChild(timeline);
    container.appendChild(logPanel);
  }

  // Attempts
  if (attempts.length > 0) {
    const attLabel = el('div', { class: 'section-heading', style: { marginTop: '16px' } }, txt('LAUNCH ATTEMPTS'));
    container.appendChild(attLabel);
    const attPanel = el('div', { class: 'panel' });
    const table = el('table', { class: 'attempts-table' });
    const thead = el('thead');
    const hr = el('tr');
    for (const h of ['#', 'STATUS', 'STARTED', 'FINISHED', 'WORKER', 'ERROR']) {
      hr.appendChild(el('th', null, txt(h)));
    }
    thead.appendChild(hr); table.appendChild(thead);
    const tbody = el('tbody');
    attempts.forEach((a, i) => {
      const tr = el('tr');
      const tdN = el('td'); tdN.appendChild(txt(i + 1)); tr.appendChild(tdN);
      const tdS = el('td'); tdS.appendChild(statusBadge(a.status)); tr.appendChild(tdS);
      const tdSt = el('td'); tdSt.appendChild(txt(fmtTs(a.started))); tr.appendChild(tdSt);
      const tdFi = el('td'); tdFi.appendChild(txt(fmtTs(a.finished))); tr.appendChild(tdFi);
      const tdW  = el('td'); tdW.appendChild(txt(a.worker_id || a.agent || '—')); tr.appendChild(tdW);
      const tdE  = el('td'); tdE.appendChild(txt(a.error || '—')); tr.appendChild(tdE);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    attPanel.appendChild(table);
    container.appendChild(attPanel);
  }
});

/* ═══════════════════════════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════════════════════════ */

startClock();
// ONE-TIME: catch up immediately when tab returns to the foreground.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) mountView(_currentRoute, true);
});
render();
</script>
</body>
</html>
